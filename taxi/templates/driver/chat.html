{% extends "driver/base.html" %}
{% block title %}Chat{% endblock %}

{% block content %}

<!-- Navbar -->
<div class="ios-navbar sticky top-3 mx-4 z-20">
  <div class="px-4 pt-3 pb-3 flex items-center gap-3">
    <div class="w-9 h-9 rounded-full bg-[#34C759] flex items-center justify-center flex-shrink-0">
      <i class="fas fa-users text-white text-sm"></i>
    </div>
    <div class="flex-1 min-w-0">
      <div class="ios-title font-semibold">Guruh chat</div>
      <div class="ios-caption2" style="color:var(--ios-label3)">{{ driver_count }} a'zo</div>
    </div>
  </div>
</div>

<!-- ═══════════════ GURUH CHAT ═══════════════ -->
<div id="pane-group" style="display:flex;flex-direction:column;height:calc(100dvh - 100px)">

  <div id="gr-messages" style="flex:1;overflow-y:auto;padding:12px 16px 8px;display:flex;flex-direction:column;gap:8px">
    <div class="text-center py-16 anim-fade" id="gr-empty">
      <div class="w-16 h-16 rounded-full bg-[#34C759]/10 flex items-center justify-center mx-auto mb-4">
        <i class="fas fa-users text-[#34C759] text-2xl"></i>
      </div>
      <p class="ios-title font-semibold">Haydovchilar guruhi</p>
      <p class="ios-subhead mt-1" style="color:var(--ios-label3)">Barcha haydovchilar bilan muloqot</p>
    </div>
  </div>

  <!-- Group input -->
  <div style="flex-shrink:0;padding:10px 12px;border-top:.5px solid var(--ios-sep);background:var(--ios-card)">
    <div style="display:flex;align-items:center;gap:8px">
      <input type="text" id="gr-msg-in" placeholder="Guruhga yozing..." maxlength="500" autocomplete="off"
             style="flex:1;background:var(--ios-fill);border:none;outline:none;border-radius:22px;padding:10px 16px;font-size:16px;color:var(--ios-label);min-width:0"
             onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendGrMsg();}">
      <button onclick="sendGrMsg()"
              style="width:36px;height:36px;border-radius:50%;background:#34C759;border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;-webkit-tap-highlight-color:transparent">
        <i class="fas fa-arrow-up" style="color:#fff;font-size:14px"></i>
      </button>
    </div>
  </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
const MY_DRIVER_ID = {{ driver.id }};
const MY_NAME      = "{{ driver.full_name|escapejs }}";

// Jonli ovozli aloqa ("efir") JS kodi endi base.html'da — Asosiy sahifa
// navbaridagi mikrofon tugmasi bilan bir xil funksiyalarni ishlatish uchun.

// ── Scroll ────────────────────────────────────────────────────────────────────
function scrollBottom(smooth=true) {
  const el = document.getElementById('gr-messages');
  if (el) el.scrollTo({ top: el.scrollHeight, behavior: smooth ? 'smooth' : 'instant' });
}

// ── Keyboard layout ───────────────────────────────────────────────────────────
function adjustLayout() {
  const vv = window.visualViewport;
  if (!vv) return;
  const navH = 100;
  const h = Math.max(vv.height - navH, 200) + 'px';
  document.getElementById('pane-group').style.height = h;
  scrollBottom(false);
}
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', adjustLayout);
  window.visualViewport.addEventListener('scroll', adjustLayout);
}
window.addEventListener('load', adjustLayout);
document.getElementById('gr-msg-in').addEventListener('focus', () => setTimeout(() => { adjustLayout(); scrollBottom(); }, 100));
document.getElementById('gr-msg-in').addEventListener('blur',  () => setTimeout(adjustLayout, 100));

// ── Audio playback ────────────────────────────────────────────────────────────
let _curAudio = null;
function toggleAudio(btn) {
  const src  = btn.dataset.src;
  const wrap = btn.closest('.flex.items-center') || btn.parentElement;
  const prog = wrap.querySelector('.audio-progress');
  const dur  = wrap.querySelector('.audio-dur');
  const icon = btn.querySelector('i');
  if (_curAudio && !_curAudio.paused) { _curAudio.pause(); icon.className='fas fa-play text-xs'; return; }
  if (_curAudio) _curAudio.pause();
  _curAudio = new Audio(src);
  _curAudio.play();
  icon.className = 'fas fa-pause text-xs';
  _curAudio.addEventListener('timeupdate', () => {
    if (prog) prog.style.width = (_curAudio.currentTime / (_curAudio.duration||1)*100) + '%';
    const s = Math.floor(_curAudio.currentTime);
    if (dur) dur.textContent = Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  });
  _curAudio.addEventListener('ended', () => {
    icon.className = 'fas fa-play text-xs';
    if (prog) prog.style.width = '0%';
    if (dur)  dur.textContent  = '🎤 Ovozli xabar';
  });
}

// ══════════════════════════════════════════════════════════════════════════════
// GURUH CHAT
// ══════════════════════════════════════════════════════════════════════════════
let grLastId = 0;
loadGroupMessages();

async function loadGroupMessages() {
  try {
    const r = await fetch('{% url "driver:group_chat_list" %}?last_id=0');
    const d = await r.json();
    d.messages.forEach(m => appendGrMsg(m, false));
    if (d.messages.length) grLastId = d.messages[d.messages.length-1].id;
    scrollBottom(false);
  } catch(_) {}
}

async function sendGrMsg() {
  const inp  = document.getElementById('gr-msg-in');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  Native.vibrate(10);
  try {
    const r = await fetch('{% url "driver:group_chat_send" %}', {
      method:'POST',
      headers:{'Content-Type':'application/json','X-CSRFToken':getCookie('csrftoken')},
      body:JSON.stringify({text}),
    });
    const d = await r.json();
    if (d.id) { grLastId = d.id; appendGrMsg(d, true); }
  } catch(_) {}
}

// Telegram uslubidagi kun ajratuvchisi — "Bugun"/"Kecha"/sana. Xabarlar
// doim xronologik tartibda qo'shilgani uchun, oxirgi ko'rsatilgan sanani
// eslab qolish yetarli (har safar qayta tekshirmasdan).
let _grLastDateLabel = null;
function _grDateLabel(d) {
  const now = new Date();
  const startOfDay = x => new Date(x.getFullYear(), x.getMonth(), x.getDate());
  const diffDays = Math.round((startOfDay(now) - startOfDay(d)) / 86400000);
  if (diffDays === 0) return 'Bugun';
  if (diffDays === 1) return 'Kecha';
  return d.toLocaleDateString('uz', {day:'numeric', month:'long', year: d.getFullYear() !== now.getFullYear() ? 'numeric' : undefined});
}
function _maybeInsertGrDateSep(dateObj) {
  const label = _grDateLabel(dateObj);
  if (label === _grLastDateLabel) return;
  _grLastDateLabel = label;
  const wrap = document.getElementById('gr-messages');
  const sep = document.createElement('div');
  sep.className = 'anim-fade';
  sep.style.cssText = 'text-align:center;margin:10px 0';
  sep.innerHTML = `<span style="display:inline-block;padding:4px 12px;border-radius:12px;background:var(--ios-fill);font-size:11px;font-weight:700;color:var(--ios-label3)">${label}</span>`;
  wrap.appendChild(sep);
}

// Boshqa haydovchining xabari yonida ko'rinadigan doiraviy profil belgisi —
// rasmi bo'lsa shu, bo'lmasa ismining bosh harfi.
function _grAvatarEl(msg) {
  if (msg.photo_url) {
    return `<img src="${msg.photo_url}" style="width:30px;height:30px;border-radius:50%;object-fit:cover;flex-shrink:0">`;
  }
  const letter = (msg.driver_name || 'H').charAt(0).toUpperCase();
  return `<div style="width:30px;height:30px;border-radius:50%;background:#1c1c1f;color:#34C759;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0">${letter}</div>`;
}

function appendGrMsg(msg, scroll=true) {
  const wrap  = document.getElementById('gr-messages');
  const empty = document.getElementById('gr-empty');
  if (empty) empty.remove();
  const isMe = msg.driver_id === MY_DRIVER_ID;
  const msgDate = new Date(msg.created_at);
  _maybeInsertGrDateSep(msgDate);
  const time = msgDate.toLocaleTimeString('uz',{hour:'2-digit',minute:'2-digit'});
  const div  = document.createElement('div');
  div.className = `flex items-end gap-2 ${isMe?'justify-end':'justify-start'} anim-fade`;

  const nameLine = isMe ? '' : `<div style="font-size:11px;font-weight:800;color:#34C759;margin-bottom:3px">${escHtml(msg.driver_name)} · ${escHtml(msg.car_number||'')}</div>`;
  let content = msg.audio_url ? audioBubble(msg.audio_url, isMe) : escHtml(msg.text);

  div.innerHTML = `${isMe?'':_grAvatarEl(msg)}<div class="max-w-[74%] px-4 py-2.5 ios-subhead leading-snug
    ${isMe?'rounded-[18px] rounded-br-[4px] text-black':'rounded-[18px] rounded-bl-[4px]'}"
    style="${isMe?'background:#FFD600':'background:var(--ios-card);color:var(--ios-label)'}">
    ${nameLine}${content}
    <div class="ios-caption2 mt-1" style="${isMe?'color:rgba(0,0,0,.4)':'color:var(--ios-label3)'}">${time}</div>
  </div>`;
  wrap.appendChild(div);
  if (scroll) scrollBottom();
}

// Group polling
setInterval(async () => {
  try {
    const r = await fetch(`{% url "driver:group_chat_list" %}?last_id=${grLastId}`);
    const d = await r.json();
    d.messages.forEach(m => {
      if (m.id > grLastId) {
        grLastId = m.id;
        if (m.driver_id !== MY_DRIVER_ID) {
          appendGrMsg(m);
          Native.vibrate([30,15,30]);
        }
      }
    });
  } catch(_) {}
}, 4000);

// ── Helpers ───────────────────────────────────────────────────────────────────
function audioBubble(src, isMe) {
  return `<div class="flex items-center gap-2" style="min-width:160px">
    <button data-src="${src}" onclick="toggleAudio(this)"
      style="width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;${isMe?'background:rgba(0,0,0,.15)':'background:rgba(0,122,255,.15)'}">
      <i class="fas fa-play text-xs" style="${isMe?'color:#000':'color:#007AFF'}"></i>
    </button>
    <div style="flex:1">
      <div style="height:3px;border-radius:2px;background:rgba(0,0,0,.15);overflow:hidden">
        <div class="audio-progress" style="height:100%;width:0%;border-radius:2px;background:${isMe?'rgba(0,0,0,.4)':'#007AFF'};transition:width .1s"></div>
      </div>
      <div class="audio-dur ios-caption2 mt-1" style="${isMe?'color:rgba(0,0,0,.5)':'color:var(--ios-label3)'}">🎤 Ovozli xabar</div>
    </div>
  </div>`;
}

function escHtml(t) {
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
{% endblock %}
