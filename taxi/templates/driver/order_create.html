{% extends "driver/base.html" %}
{% block title %}Buyurtma yaratish{% endblock %}

{% block content %}

<!-- Navbar -->
<div class="ios-navbar sticky top-3 mx-4 z-20">
  <div class="px-4 pt-3 pb-2 flex items-center gap-3">
    <a href="{% url 'driver:home' %}" onclick="Native.vibrate()"
       class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0" style="background:var(--ios-fill)">
      <i class="fas fa-arrow-left text-[15px]" style="color:var(--ios-label)"></i>
    </a>
    <div class="ios-title font-semibold flex-1">Buyurtma yaratish</div>
  </div>
</div>

<div class="px-4 pt-4 pb-32" style="max-width:520px;margin:0 auto">

  <div class="ios-card2 rounded-2xl p-4 mb-4">
    <label class="ios-footnote font-semibold" style="color:var(--ios-label3)">Mijoz telefon raqami *</label>
    <input id="oc-phone" type="tel" placeholder="+998 90 123 45 67" autocomplete="off"
           class="w-full mt-1.5 px-3.5 py-3 rounded-xl ios-subhead" style="background:var(--ios-fill);border:none;outline:none;color:var(--ios-label)">
  </div>

  <div class="ios-card2 rounded-2xl p-4 mb-4">
    <label class="ios-footnote font-semibold" style="color:var(--ios-label3)">Qayerdan *</label>
    <div class="flex flex-wrap gap-2 mt-2">
      {% for addr in saved_addresses %}
      <button type="button" onclick="ocPickAddress({{ addr.pk }}, '{{ addr.name|escapejs }}')"
              id="oc-addr-{{ addr.pk }}" class="oc-addr-chip px-3 py-2 rounded-xl ios-subhead font-semibold transition-colors"
              style="background:var(--ios-fill);color:var(--ios-label)">
        <i class="fas fa-location-dot mr-1" style="font-size:11px;color:#FF3B30"></i>{{ addr.name }}
      </button>
      {% endfor %}
      <button type="button" onclick="ocPickAddress(null, null)"
              id="oc-addr-other" class="oc-addr-chip px-3 py-2 rounded-xl ios-subhead font-semibold transition-colors"
              style="background:var(--ios-fill);color:var(--ios-label)">
        <i class="fas fa-pen mr-1" style="font-size:11px"></i>Boshqa
      </button>
    </div>
    <input id="oc-from" type="text" placeholder="Manzilni yozing..." autocomplete="off"
           class="w-full mt-2.5 px-3.5 py-3 rounded-xl ios-subhead hidden" style="background:var(--ios-fill);border:none;outline:none;color:var(--ios-label)">
    <p id="oc-from-hint" class="ios-caption2 mt-1.5" style="color:var(--ios-label3)">
      <i class="fas fa-list mr-1"></i>Ro'yxatdan manzil tanlang yoki "Boshqa"ni bosib o'zingiz yozing
    </p>
  </div>

  <div class="ios-card2 rounded-2xl p-4 mb-4">
    <label class="ios-footnote font-semibold" style="color:var(--ios-label3)">Buyurtmani kim oladi?</label>
    <div class="flex gap-2 mt-1.5">
      <button type="button" id="oc-assign-self" onclick="ocSetAssign('self')"
              class="flex-1 py-2.5 rounded-xl ios-subhead font-semibold" style="background:#FFD600;color:#000">O'zim olaman</button>
      <button type="button" id="oc-assign-others" onclick="ocSetAssign('others')"
              class="flex-1 py-2.5 rounded-xl ios-subhead font-semibold" style="background:var(--ios-fill);color:var(--ios-label)">Boshqa haydovchilar</button>
    </div>
  </div>

  <button id="oc-submit" onclick="ocSubmit()"
          class="w-full py-3.5 rounded-xl ios-subhead font-bold" style="background:#FFD600;color:#000">
    Buyurtma yaratish
  </button>
</div>

{% endblock %}

{% block extra_js %}
<script>
let ocAssign  = 'self';
let ocAddrId  = undefined;  // tanlanmagan: undefined | saqlangan manzil: son | "Boshqa": null

function ocSetAssign(v) {
  ocAssign = v;
  document.getElementById('oc-assign-self').style.background   = v === 'self' ? '#FFD600' : 'var(--ios-fill)';
  document.getElementById('oc-assign-self').style.color        = v === 'self' ? '#000' : 'var(--ios-label)';
  document.getElementById('oc-assign-others').style.background = v === 'others' ? '#FFD600' : 'var(--ios-fill)';
  document.getElementById('oc-assign-others').style.color      = v === 'others' ? '#000' : 'var(--ios-label)';
}

function ocPickAddress(id, name) {
  ocAddrId = id;
  document.querySelectorAll('.oc-addr-chip').forEach(function (el) {
    el.style.background = 'var(--ios-fill)';
    el.style.color = 'var(--ios-label)';
  });
  const activeEl = document.getElementById(id !== null ? 'oc-addr-' + id : 'oc-addr-other');
  if (activeEl) { activeEl.style.background = '#FFD600'; activeEl.style.color = '#000'; }

  const input = document.getElementById('oc-from');
  const hint  = document.getElementById('oc-from-hint');
  if (id === null) {
    input.classList.remove('hidden');
    input.value = '';
    input.focus();
    hint.innerHTML = '<i class="fas fa-users mr-1"></i>Bu buyurtma umumiy tabloga tushib, barcha haydovchilarga bir vaqtda ko\'rinadi';
  } else {
    input.classList.add('hidden');
    input.value = name;
    hint.innerHTML = '<i class="fas fa-list-ol mr-1"></i>Shu manzil navbatida turgan haydovchiga taklif qilinadi';
  }
}

async function ocSubmit() {
  const phone = document.getElementById('oc-phone').value.trim();
  const freeText = document.getElementById('oc-from').value.trim();

  if (!phone || ocAddrId === undefined || (ocAddrId === null && !freeText)) {
    showToast('Xatolik', 'Mijoz raqami va manzilni tanlang/kiriting', 'error', 3000);
    return;
  }

  const btn = document.getElementById('oc-submit');
  btn.disabled = true;
  btn.style.opacity = '.6';
  Native.vibrate(10);

  try {
    const fd = new FormData();
    fd.append('phone_number', phone);
    if (ocAddrId !== null) {
      fd.append('saved_address_id', ocAddrId);
    } else {
      fd.append('from_address', freeText);
    }
    fd.append('assign_to', ocAssign);
    fd.append('csrfmiddlewaretoken', getCookie('csrftoken'));

    const r = await fetch('{% url "driver:order_create" %}', { method: 'POST', body: fd });
    const d = await r.json();

    if (d.ok) {
      showToast('Buyurtma yaratildi', `#${d.order_id}`, 'success', 3000);
      setTimeout(() => { window.location.href = '{% url "driver:home" %}'; }, 700);
    } else {
      showToast('Xatolik', d.error || 'Nimadir xato ketdi', 'error', 4000);
      btn.disabled = false;
      btn.style.opacity = '1';
    }
  } catch (_) {
    showToast('Xatolik', 'Tarmoq xatosi', 'error', 3000);
    btn.disabled = false;
    btn.style.opacity = '1';
  }
}

ocSetAssign('self');
</script>
{% endblock %}
